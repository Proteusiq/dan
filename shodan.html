<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shodan Study — IOGKF Denmark</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Rajdhani:wght@300;400;600;700&display=swap');

  :root {
    --ink: #0a0a0a;
    --paper: #f5f0e8;
    --red: #c0392b;
    --red-dark: #922b21;
    --red-light: #e74c3c;
    --gold: #d4a017;
    --grey: #2c2c2c;
    --grey-light: #3d3d3d;
    --text: #e8e0d0;
    --text-dim: #8a8070;
    --correct: #27ae60;
    --wrong: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    -webkit-text-size-adjust: 100%;
    width: 100%;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(192,57,43,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(192,57,43,0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px 80px;
    width: 100%;
    overflow-x: hidden;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }

  .header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid rgba(192,57,43,0.3);
    margin-bottom: 28px;
  }
  .header-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 42px;
    color: var(--red);
    letter-spacing: 8px;
    opacity: 0.85;
    display: block;
    margin-bottom: 4px;
  }
  .header-title {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 300;
    overflow-wrap: break-word;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    opacity: 0.7;
    padding: 0 8px;
  }

  .progress-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    padding: 0 4px;
  }
  .progress-item {
    height: 3px;
    flex: 1;
    background: var(--grey-light);
    border-radius: 2px;
    transition: background 0.3s;
  }
  .progress-item.done { background: var(--correct); }
  .progress-item.wrong-done { background: var(--wrong); }
  .progress-item.current { background: var(--gold); }

  .nav {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    background: var(--grey);
    border-radius: 10px;
    padding: 3px;
  }
  .nav-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nav-btn.active {
    background: var(--red);
    color: white;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .cat-btn {
    padding: 16px 12px;
    background: var(--grey);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .cat-btn:hover { background: var(--grey-light); border-color: var(--red); }
  .cat-btn.active { background: rgba(192,57,43,0.2); border-color: var(--red); color: white; }
  .cat-icon { display: block; margin-bottom: 6px; line-height: 1; }
  .cat-icon svg { display: block; }
  .cat-count { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  .study-cards { display: flex; flex-direction: column; gap: 10px; }
  .study-card {
    background: var(--grey);
    border-radius: 10px;
    padding: 16px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }
  .study-card:hover { border-left-color: var(--red); background: var(--grey-light); }
  .study-card-q { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.4; word-break: break-word; }
  .study-card-a {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 8px;
    margin-top: 4px;
    display: none;
    line-height: 1.5;
  }
  .study-card.open .study-card-a { display: block; }
  .study-card-tag {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .study-card-source {
    font-size: 10px;
    color: var(--red);
    opacity: 0.7;
    margin-top: 8px;
  }

  .quiz-setup {
    text-align: center;
    padding: 20px 0;
  }
  .quiz-setup h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .quiz-setup p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .quiz-filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .filter-btn {
    padding: 12px;
    background: var(--grey);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .filter-btn.selected { background: rgba(192,57,43,0.25); border-color: var(--red); color: white; }

  .start-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--red);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .start-btn:hover { background: var(--red-light); transform: translateY(-1px); }

  .quiz-active { display: none; }
  .quiz-active.visible { display: block; }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .quiz-score { color: var(--gold); font-weight: 700; font-size: 14px; }

  .quiz-question-card {
    background: var(--grey);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border-top: 2px solid var(--red);
  }
  .quiz-category-tag {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .quiz-question-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.5;
    color: white;
    word-break: break-word;
  }

  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-btn {
    padding: 14px 16px;
    background: var(--grey);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
    word-break: break-word;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--gold); color: white; background: var(--grey-light); }
  .option-btn.correct { background: rgba(39,174,96,0.2); border-color: var(--correct); color: #2ecc71; }
  .option-btn.wrong { background: rgba(192,57,43,0.2); border-color: var(--wrong); color: #e74c3c; }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    text-align: center;
    line-height: 22px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 10px;
    vertical-align: middle;
    letter-spacing: 0;
  }

  .explanation-box {
    background: var(--grey);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border-left: 3px solid var(--correct);
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .explanation-box.wrong-exp { border-left-color: var(--wrong); }
  .explanation-box.visible { display: block; }
  .exp-header {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .exp-header.correct-h { color: var(--correct); }
  .exp-header.wrong-h { color: var(--wrong); }
  .exp-text { font-size: 13px; color: var(--text); line-height: 1.6; word-break: break-word; }
  .exp-correct-ans {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }
  .exp-source {
    font-size: 11px;
    color: var(--red);
    margin-top: 8px;
    opacity: 0.8;
  }

  .next-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--red);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    display: none;
  }
  .next-btn.visible { display: block; }

  .results-screen {
    text-align: center;
    padding: 20px 0;
    display: none;
  }
  .results-screen.visible { display: block; animation: fadeIn 0.3s ease; }
  .result-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid var(--red);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .result-pct { font-size: 32px; font-weight: 700; color: white; }
  .result-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
  .results-detail {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .result-stat {
    background: var(--grey);
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
  }
  .result-stat-num { font-size: 24px; font-weight: 700; }
  .result-stat-num.g { color: var(--correct); }
  .result-stat-num.r { color: var(--wrong); }
  .result-stat-lbl { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .review-list { text-align: left; margin-bottom: 20px; }
  .review-item {
    background: rgba(192,57,43,0.1);
    border-left: 3px solid var(--wrong);
    border-radius: 0 8px 8px 0;
    padding: 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .review-q { font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .review-a { color: var(--gold); font-size: 12px; }
  .retry-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px solid var(--red);
    border-radius: 10px;
    color: var(--red);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .flashcard-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    max-width: 100%;
  }
  .fc-filter {
    padding: 6px 12px;
    background: var(--grey);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .fc-filter.active { background: var(--red); color: white; border-color: var(--red); }

  .flashcard-wrap {
    perspective: 1000px;
    margin-bottom: 16px;
    height: 220px;
  }
  .flashcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .fc-front {
    background: var(--grey);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: 3px solid var(--red);
  }
  .fc-back {
    background: rgba(192,57,43,0.15);
    border: 1px solid var(--red);
    border-top: 3px solid var(--gold);
    transform: rotateY(180deg);
  }
  .fc-hint { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
  .fc-main { font-size: 20px; font-weight: 700; color: white; line-height: 1.3; word-break: break-word; }
  .fc-sub { font-size: 14px; color: var(--text-dim); margin-top: 8px; }
  .fc-answer { font-size: 16px; font-weight: 600; color: var(--gold); word-break: break-word; }
  .fc-answer-sub { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.5; word-break: break-word; }

  .fc-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .fc-nav-btn {
    padding: 12px 20px;
    background: var(--grey);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .fc-nav-btn:hover { border-color: var(--red); color: white; }
  .fc-counter { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; }

  .section-title {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-left: 4px;
    border-left: 2px solid var(--red);
    padding-left: 10px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .back-link:hover { color: var(--red); }

  @media (max-width: 480px) {
    .header-kanji { font-size: 32px; letter-spacing: 4px; }
    .header-title { letter-spacing: 2px; font-size: 12px; }
    .category-grid { grid-template-columns: 1fr; }
    .quiz-filter-grid { grid-template-columns: 1fr; }
    .fc-face { padding: 16px; }
    .fc-main { font-size: 17px; }
    .fc-answer { font-size: 15px; }
    .result-stat { padding: 10px 14px; }
    .results-detail { gap: 8px; }
    .nav-btn { font-size: 12px; letter-spacing: 1px; padding: 10px 4px; }
    .quiz-question-card { padding: 16px; }
    .explanation-box { padding: 14px; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--grey-light); border-radius: 2px; }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="auth-gate" style="display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:-webkit-fill-available;padding:24px;width:100%;max-width:100%">
  <div style="text-align:center;max-width:340px;width:100%">
    <div style="font-family:'Noto Serif JP',serif;font-size:42px;color:var(--red);letter-spacing:8px;opacity:0.85;margin-bottom:16px">剛柔流</div>
    <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:32px">Adgangskode paakraevet</div>
    <input id="auth-input" type="password" placeholder="Indtast adgangskode" autocomplete="off"
      style="width:100%;padding:14px;background:var(--grey);border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;text-align:center;letter-spacing:2px;outline:none;margin-bottom:12px"
      onkeydown="if(event.key==='Enter')tryAuth()"
      onfocus="this.style.borderColor='var(--red)'" onblur="this.style.borderColor='rgba(255,255,255,0.08)'">
    <button onclick="tryAuth()" style="width:100%;padding:14px;background:var(--red);border:none;border-radius:10px;color:white;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer">Lås op</button>
    <div id="auth-error" style="color:var(--wrong);font-size:12px;margin-top:12px;display:none">Forkert adgangskode</div>
  </div>
</div>

<div class="app" id="main-app" style="display:none">

  <a href="index.html" class="back-link">← Tilbage til menu</a>

  <div class="header">
    <span class="header-kanji">剛柔流</span>
    <div class="header-title">Shodan Examination Study</div>
    <div class="header-sub">Baseret på KD-80 Karatehistorien & Officielt Shodan Pensum</div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showScreen('study')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Studér
    </button>
    <button class="nav-btn" onclick="showScreen('quiz')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Quiz
    </button>
    <button class="nav-btn" onclick="showScreen('flash')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      Kort
    </button>
  </nav>

  <!-- STUDY SCREEN -->
  <div id="screen-study" class="screen active">
    <div class="category-grid" id="cat-grid"></div>
    <div id="study-cards" class="study-cards"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div id="quiz-setup" class="quiz-setup">
      <h2>Quiz</h2>
      <p>Vælg kategorier (officielle eksamens-spørgsmål)</p>
      <div class="quiz-filter-grid" id="quiz-filters"></div>
      <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz-active" class="quiz-active">
      <div id="progress-bar" class="progress-bar"></div>
      <div class="quiz-meta">
        <span id="q-counter">Spørgsmål 1/20</span>
        <span class="quiz-score" id="q-score">0 / 0</span>
      </div>
      <div class="quiz-question-card">
        <div class="quiz-category-tag" id="q-cat"></div>
        <div class="quiz-question-text" id="q-text"></div>
      </div>
      <div class="quiz-options" id="q-options"></div>
      <div class="explanation-box" id="q-explanation">
        <div class="exp-header" id="exp-header"></div>
        <div class="exp-text" id="exp-text"></div>
        <div class="exp-correct-ans" id="exp-correct"></div>
        <div class="exp-source" id="exp-source"></div>
      </div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Næste →</button>
    </div>

    <div id="quiz-results" class="results-screen">
      <div class="result-circle">
        <div class="result-pct" id="res-pct">0%</div>
        <div class="result-label">SCORE</div>
      </div>

// ============================================================
// DECRYPTION
// ============================================================
function b64decode(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function decryptData(password, blob) {
  const [saltB64, ivB64, tagB64, ctB64] = blob.split(':');
  const salt = b64decode(saltB64);
  const iv = b64decode(ivB64);
  const tag = b64decode(tagB64);
  const ct = b64decode(ctB64);
  const combined = new Uint8Array(ct.length + tag.length);
  combined.set(ct); combined.set(tag, ct.length);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

async function tryAuth() {
  const pw = document.getElementById('auth-input').value;
  const errEl = document.getElementById('auth-error');
  try {
    const data = await decryptData(pw, ENC_BLOB);
    studyData = data.studyData;
    quizData = data.quizData;
    flashcardSets = data.flashcardSets;
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('main-app').style.display = '';
    errEl.style.display = 'none';
    init();
  } catch (e) {
    errEl.style.display = 'block';
  }
}

  ];
  grid.innerHTML = catConfig.map(c => `
    <button class="cat-btn ${c.key === 'history' ? 'active' : ''}" onclick="showStudyCategory('${c.key}')" id="cat-${c.key}">
      <span class="cat-icon" style="color:${c.color}">${c.icon}</span>
      ${c.label}
      <div class="cat-count">${studyData[c.key].items.length} emner</div>
    </button>
  `).join('');
}

function showStudyCategory(key) {
  currentStudyCat = key;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('cat-' + key);
  if (btn) btn.classList.add('active');

  const container = document.getElementById('study-cards');
  const items = studyData[key].items;
  container.innerHTML = `<div class="section-title">${studyData[key].label} — ${items.length} emner (tryk for svar)</div>` +
    items.map((item, i) => `
      <div class="study-card" onclick="toggleCard(this)">
        <div class="study-card-q">${item.q}</div>
        <div class="study-card-a">${item.a}${item.src ? `<div class="study-card-source">Kilde: ${item.src}</div>` : ''}</div>
      </div>
    `).join('');
}

function toggleCard(el) { el.classList.toggle('open'); }

function buildQuizFilters() {
  const cont = document.getElementById('quiz-filters');
  const filters = [
    { key: 'history', label: 'Historie' },
    { key: 'technical', label: 'Teknik' },
    { key: 'all', label: 'Alle emner' },
  ];
  cont.innerHTML = filters.map(f => `
    <button class="filter-btn ${selectedFilters.includes(f.key) || f.key === 'all' ? 'selected' : ''}" 
      onclick="toggleFilter('${f.key}', this)">${f.label}</button>
  `).join('');
}

function toggleFilter(key, el) {
  if (key === 'all') {
    selectedFilters = ['history','technical'];
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('selected'));
    return;
  }
  if (selectedFilters.includes(key)) {
    if (selectedFilters.length > 1) {
      selectedFilters = selectedFilters.filter(f => f !== key);
      el.classList.remove('selected');
    }
  } else {
    selectedFilters.push(key);
    el.classList.add('selected');
  }
}

function startQuiz() {
  const catMap = { history: 'Historie', technical: 'Teknik' };
  const selectedCatNames = selectedFilters.map(f => catMap[f]);
  let pool = quizData.filter(q => selectedCatNames.includes(q.cat));
  pool = shuffle(pool).slice(0, Math.min(20, pool.length));
  quizQueue = pool;
  quizIndex = 0;
  quizCorrect = 0;
  quizWrong = [];
  progressArr = new Array(pool.length).fill('pending');

  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-active').classList.add('visible');
  document.getElementById('quiz-results').classList.remove('visible');
  buildProgressBar();
  showQuestion();
}

function buildProgressBar() {
  const bar = document.getElementById('progress-bar');
  bar.innerHTML = progressArr.map((s, i) => `<div class="progress-item ${i === quizIndex ? 'current' : ''}" id="prog-${i}"></div>`).join('');
}

function updateProgress(index, status) {
  progressArr[index] = status;
  const el = document.getElementById('prog-' + index);
  if (el) {
    el.className = 'progress-item';
    if (status === 'correct') el.classList.add('done');
    else if (status === 'wrong') el.classList.add('wrong-done');
    else if (status === 'current') el.classList.add('current');
  }
  if (index + 1 < progressArr.length) {
    const next = document.getElementById('prog-' + (index + 1));
    if (next) next.classList.add('current');
  }
}

function showQuestion() {
  if (quizIndex >= quizQueue.length) { showResults(); return; }
  answered = false;
  const q = quizQueue[quizIndex];
  document.getElementById('q-counter').textContent = `Spørgsmål ${quizIndex + 1}/${quizQueue.length}`;
  document.getElementById('q-score').textContent = `${quizCorrect} / ${quizIndex}`;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;

  const optsCont = document.getElementById('q-options');
  const letters = ['A','B','C','D'];
  optsCont.innerHTML = q.opts.map((opt, i) => `
    <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
      <span class="option-letter">${letters[i]}</span>${opt}
    </button>
  `).join('');

  document.getElementById('q-explanation').classList.remove('visible','wrong-exp');
  document.getElementById('next-btn').classList.remove('visible');
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = quizQueue[quizIndex];
  const isCorrect = chosen === q.ans;

  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === chosen && !isCorrect) btn.classList.add('wrong');
  });

  const expBox = document.getElementById('q-explanation');
  const expHeader = document.getElementById('exp-header');
  const expText = document.getElementById('exp-text');
  const expCorrect = document.getElementById('exp-correct');
  const expSource = document.getElementById('exp-source');

  if (isCorrect) {
    quizCorrect++;
    expBox.classList.remove('wrong-exp');
    expHeader.className = 'exp-header correct-h';
    expHeader.textContent = 'Korrekt!';
    expText.textContent = q.exp;
    expCorrect.textContent = '';
  } else {
    expBox.classList.add('wrong-exp');
    expHeader.className = 'exp-header wrong-h';
    expHeader.textContent = 'Forkert';
    expText.textContent = q.exp;
    expCorrect.textContent = `Korrekt svar: ${q.opts[q.ans]}`;
    quizWrong.push(q);
  }
  expSource.textContent = q.src ? `Kilde: ${q.src}` : '';

  expBox.classList.add('visible');
  document.getElementById('next-btn').classList.add('visible');
  updateProgress(quizIndex, isCorrect ? 'correct' : 'wrong');
  document.getElementById('q-score').textContent = `${quizCorrect} / ${quizIndex + 1}`;
}

function nextQuestion() { quizIndex++; showQuestion(); }

function showResults() {
  document.getElementById('quiz-active').classList.remove('visible');
  const total = quizQueue.length;
  const pct = Math.round((quizCorrect / total) * 100);
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = quizCorrect;
  document.getElementById('res-wrong').textContent = total - quizCorrect;

  const reviewList = document.getElementById('review-list');
  if (quizWrong.length > 0) {
    reviewList.innerHTML = `<div class="section-title" style="margin-bottom:12px">Fejl — gennemgå disse</div>` +
      quizWrong.map(q => `
        <div class="review-item">
          <div class="review-q">${q.q}</div>
          <div class="review-a">Korrekt: ${q.opts[q.ans]}</div>
        </div>
      `).join('');
  } else {
    reviewList.innerHTML = `<div style="text-align:center;color:#27ae60;font-weight:700;font-size:18px;padding:16px 0">Perfekt! Ingen fejl</div>`;
  }

  document.getElementById('quiz-results').classList.add('visible');
}

function retryWrong() {
  if (quizWrong.length === 0) return;
  quizQueue = shuffle([...quizWrong]);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrong = [];
  progressArr = new Array(quizQueue.length).fill('pending');
  document.getElementById('quiz-results').classList.remove('visible');
  document.getElementById('quiz-active').classList.add('visible');
  buildProgressBar();
  showQuestion();
}

function resetQuiz() {
  document.getElementById('quiz-results').classList.remove('visible');
  document.getElementById('quiz-active').classList.remove('visible');
  document.getElementById('quiz-setup').style.display = '';
}

function buildFlashcardFilters() {
  const cont = document.getElementById('fc-filters');
  cont.innerHTML = Object.keys(flashcardSets).map(key => `
    <button class="fc-filter ${key === fcCat ? 'active' : ''}" onclick="showFlashcardCat('${key}')" id="fcf-${key}">
      ${flashcardSets[key].label}
    </button>
  `).join('');
}

function showFlashcardCat(key) {
  fcCat = key;
  fcIndex = 0;
  fcFlipped = false;
  document.querySelectorAll('.fc-filter').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('fcf-' + key);
  if (btn) btn.classList.add('active');
  document.getElementById('flashcard').classList.remove('flipped');
  updateFlashcard();
}

function updateFlashcard() {
  const set = flashcardSets[fcCat];
  const card = set.cards[fcIndex];
  fcFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fc-front-text').textContent = card.front;
  document.getElementById('fc-front-sub').textContent = card.front_sub;
  document.getElementById('fc-back-text').textContent = card.back;
  document.getElementById('fc-back-sub').textContent = card.back_sub;
  document.getElementById('fc-counter').textContent = `${fcIndex + 1} / ${set.cards.length}`;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
}

function fcNext() {
  const set = flashcardSets[fcCat];
  fcIndex = (fcIndex + 1) % set.cards.length;
  updateFlashcard();
}

function fcPrev() {
  const set = flashcardSets[fcCat];
  fcIndex = (fcIndex - 1 + set.cards.length) % set.cards.length;
  updateFlashcard();
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  event.target.closest('.nav-btn').classList.add('active');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// init() is called after successful decryption in tryAuth()
</script>
